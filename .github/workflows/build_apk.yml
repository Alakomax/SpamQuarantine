name: Build SpamQuarantine APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Otorgar permisos a Gradle Wrapper
      run: chmod +x gradlew || true

    - name: Generar Wrapper de Gradle si no existe
      run: gradle wrapper || true

    - name: Compilar APK Debug
      run: ./gradlew assembleDebug --no-daemon

    - name: Subir APK como Artefacto listo para descarga
      uses: actions/upload-artifact@v4
      with:
        name: SpamQuarantine-APK
        path: app/build/outputs/apk/debug/app-debug.apk

name: Build SpamQuarantine APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Configurar Gradle CLI
      uses: gradle/actions/setup-gradle@v3

    - name: Compilar APK Debug
      run: gradle assembleDebug --no-daemon --stacktrace

    - name: Subir APK como Artefacto listo para descarga
      uses: actions/upload-artifact@v4
      with:
        name: SpamQuarantine-APK
        path: app/build/outputs/apk/debug/app-debug.apk
